<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%">
  <defs>
    <linearGradient id="parentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="cardShadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1100" height="500" fill="#0B132B" rx="16" />

  <!-- Title Header -->
  <g transform="translate(50, 35)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">
      Parent / Guardian Child Safety &amp; Monitoring Portal
    </text>
    <text x="0" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Verified Boarding Confirmation • Dynamic Proximity Geofencing • Instant Speed Dial to Driver &amp; Campus Security
    </text>
  </g>

  <!-- Left: Simulated Map with Geofence Radius -->
  <g transform="translate(50, 75)" filter="url(#cardShadow2)">
    <rect width="520" height="390" rx="12" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Roads -->
    <path d="M 0 150 Q 180 130 260 210 T 520 220" fill="none" stroke="#FFFFFF" stroke-width="22" />
    <path d="M 220 0 L 260 390" fill="none" stroke="#FFFFFF" stroke-width="18" />

    <!-- Route Line -->
    <path d="M 40 150 Q 180 130 260 210 L 420 215" fill="none" stroke="#8B5CF6" stroke-width="8" stroke-linecap="round" />

    <!-- Child Home / Stop Location -->
    <circle cx="260" cy="210" r="10" fill="#7C3AED" stroke="#FFFFFF" stroke-width="3"/>
    <text x="260" y="240" fill="#4C1D95" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">🏠 Home Stop (Railway Station)</text>

    <!-- Geofence Dynamic Radius Ring -->
    <circle cx="260" cy="210" r="85" fill="rgba(139, 92, 246, 0.12)" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="260" y="115" fill="#6D28D9" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">1.0 km Proximity Geofence</text>

    <!-- Moving Bus approaching geofence -->
    <g transform="translate(140, 120)">
      <circle cx="20" cy="20" r="18" fill="#F59E0B" stroke="#FFFFFF" stroke-width="3"/>
      <text x="20" y="25" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="900" text-anchor="middle">🚌</text>
      <rect x="-10" y="40" width="60" height="18" rx="4" fill="#0F172A"/>
      <text x="20" y="52" fill="#FBBF24" font-family="sans-serif" font-size="9" font-weight="700" text-anchor="middle">Bus 01</text>
    </g>

    <!-- Child Switcher Tabs Header -->
    <g transform="translate(20, 20)">
      <rect width="180" height="34" rx="8" fill="#7C3AED" />
      <text x="90" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">👦 Anil Varma (Bus 01)</text>

      <rect x="190" y="0" width="180" height="34" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="280" y="22" fill="#475569" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">👦 Aditya Varma (Bus 01)</text>
    </g>
  </g>

  <!-- Right: Parent Safety Panel -->
  <g transform="translate(600, 75)" filter="url(#cardShadow2)">
    <rect width="450" height="390" rx="14" fill="url(#parentGrad)" stroke="#CBD5E1" stroke-width="1.2" />

    <!-- Attendance Banner -->
    <g transform="translate(0, 0)">
      <rect width="450" height="54" rx="14" fill="#D1FAE5" />
      <circle cx="34" cy="27" r="14" fill="#10B981" />
      <text x="34" y="32" fill="#FFFFFF" font-family="sans-serif" font-size="14" font-weight="800" text-anchor="middle">✓</text>
      <text x="60" y="24" fill="#065F46" font-family="sans-serif" font-size="13" font-weight="800">Child Boarding Verified</text>
      <text x="60" y="40" fill="#047857" font-family="sans-serif" font-size="11">Anil boarded Bus 01 at 07:54 AM at Main Bus Stand</text>
    </g>

    <!-- Geofence Alert Slider Control -->
    <g transform="translate(24, 75)">
      <text x="0" y="14" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="800">PROXIMITY ALERT RADIUS GEOFENCE</text>
      <text x="340" y="14" fill="#2563EB" font-family="sans-serif" font-size="11" font-weight="800">1.0 km</text>
      <line x1="0" y1="28" x2="400" y2="28" stroke="#E2E8F0" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="28" x2="160" y2="28" stroke="#3B82F6" stroke-width="6" stroke-linecap="round"/>
      <circle cx="160" cy="28" r="8" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
      <text x="0" y="46" fill="#94A3B8" font-family="sans-serif" font-size="10">Push notification triggered when bus enters radius</text>
    </g>

    <!-- Driver & ETA Info -->
    <g transform="translate(24, 142)">
      <rect width="400" height="58" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
      <text x="14" y="24" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="800">ESTIMATED CAMPUS ARRIVAL</text>
      <text x="14" y="46" fill="#0F172A" font-family="sans-serif" font-size="18" font-weight="900">08:05 AM</text>
      <text x="110" y="44" fill="#64748B" font-family="sans-serif" font-size="11">• Driver Ravi Kumar • Bus AP35 AB 1234</text>
    </g>

    <!-- Journey Audit Log -->
    <g transform="translate(24, 215)">
      <text x="0" y="12" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="800">VERIFIED JOURNEY AUDIT TIMELINE</text>
      
      <circle cx="8" cy="30" r="5" fill="#10B981"/>
      <text x="22" y="34" fill="#0F172A" font-family="sans-serif" font-size="11"><tspan font-weight="700">07:30 AM:</tspan> Bus departed Starting Depot</text>

      <circle cx="8" cy="52" r="5" fill="#10B981"/>
      <text x="22" y="56" fill="#0F172A" font-family="sans-serif" font-size="11"><tspan font-weight="700">07:54 AM:</tspan> Student boarded at Main Bus Stand (Verified via QR)</text>

      <circle cx="8" cy="74" r="5" fill="#3B82F6"/>
      <text x="22" y="78" fill="#0F172A" font-family="sans-serif" font-size="11"><tspan font-weight="700">08:05 AM (Est):</tspan> Arrival at Aditya University Campus</text>
    </g>

    <!-- Speed Dial Buttons -->
    <g transform="translate(24, 325)">
      <rect width="195" height="42" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="1.2"/>
      <text x="97" y="26" fill="#047857" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">📞 Call Driver Ravi</text>

      <rect x="205" y="0" width="195" height="42" rx="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2"/>
      <text x="302" y="26" fill="#1D4ED8" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">🎧 Transport Cell Helpdesk</text>
    </g>
  </g>
</svg>
