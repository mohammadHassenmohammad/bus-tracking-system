<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 380" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="glowRescue" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="1100" height="380" fill="#0B132B" rx="16" />

  <!-- Header -->
  <g transform="translate(50, 35)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">
      Multi-Attribute Utility Theory (MAUT) Emergency Rescue Flow
    </text>
    <text x="0" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Zero-Delay Automated Incident Detection • Capacity Constraint Guard • Instant Passenger Handover
    </text>
  </g>

  <!-- 4 Step Flow Cards -->

  <!-- STEP 1 -->
  <g transform="translate(50, 85)" filter="url(#glowRescue)">
    <rect width="220" height="250" rx="12" fill="url(#cardBg)" stroke="#EF4444" stroke-width="1.5"/>
    <rect width="220" height="42" rx="12" fill="#991B1B"/>
    <text x="110" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">1. INCIDENT REPORTED</text>
    
    <g transform="translate(16, 60)" font-family="sans-serif" font-size="11" fill="#E2E8F0">
      <text x="0" y="16" font-weight="700" fill="#F87171">Trigger Events:</text>
      <text x="0" y="34">• Driver triggers SOS</text>
      <text x="0" y="52">• Engine / Tyre failure</text>
      <text x="0" y="70">• Severe highway delay</text>
      
      <text x="0" y="105" font-weight="700" fill="#F87171">Action:</text>
      <text x="0" y="123">• Realtime alert to RTDB</text>
      <text x="0" y="141">• Bus status: 'broken'</text>
      <text x="0" y="159">• Stranded count calculated</text>
      <text x="0" y="177">  (P_stranded = 34 students)</text>
    </g>
  </g>

  <!-- ARROW 1 -->
  <g transform="translate(278, 200)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#EF4444" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="22,-5 32,0 22,5" fill="#EF4444"/>
  </g>

  <!-- STEP 2 -->
  <g transform="translate(315, 85)" filter="url(#glowRescue)">
    <rect width="230" height="250" rx="12" fill="url(#cardBg)" stroke="#F59E0B" stroke-width="1.5"/>
    <rect width="230" height="42" rx="12" fill="#B45309"/>
    <text x="115" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">2. MAUT RANKING ENGINE</text>

    <g transform="translate(16, 60)" font-family="sans-serif" font-size="11" fill="#E2E8F0">
      <text x="0" y="16" font-weight="700" fill="#FBBF24">Hard Feasibility Guard:</text>
      <text x="0" y="34">• C_spare &gt;= P_stranded</text>
      <text x="0" y="52">  (Spare capacity &gt;= 34 seats)</text>

      <text x="0" y="85" font-weight="700" fill="#FBBF24">Multi-Attribute Utility:</text>
      <text x="0" y="103">• U(b) = w1*U_dist + w2*U_cap</text>
      <text x="0" y="121">• Weights: 45% ETA, 35% cap,</text>
      <text x="0" y="139">  20% route intersection</text>
      <text x="0" y="157">• Dynamic ranking of all</text>
      <text x="0" y="175">  candidate fleet buses</text>
    </g>
  </g>

  <!-- ARROW 2 -->
  <g transform="translate(553, 200)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#F59E0B" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="22,-5 32,0 22,5" fill="#F59E0B"/>
  </g>

  <!-- STEP 3 -->
  <g transform="translate(590, 85)" filter="url(#glowRescue)">
    <rect width="220" height="250" rx="12" fill="url(#cardBg)" stroke="#3B82F6" stroke-width="1.5"/>
    <rect width="220" height="42" rx="12" fill="#1D4ED8"/>
    <text x="110" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">3. DISPATCH APPROVAL</text>

    <g transform="translate(16, 60)" font-family="sans-serif" font-size="11" fill="#E2E8F0">
      <text x="0" y="16" font-weight="700" fill="#60A5FA">Central Control Room:</text>
      <text x="0" y="34">• Top rescue candidate</text>
      <text x="0" y="52">  presented to Coordinator</text>
      <text x="0" y="70">• Best: Bus 02 (45 seats spare)</text>
      <text x="0" y="88">• Proximity: 1.8 km (4 mins)</text>

      <text x="0" y="120" font-weight="700" fill="#60A5FA">1-Click Dispatch:</text>
      <text x="0" y="138">• Admin confirms rescue</text>
      <text x="0" y="156">• Rescue mission token</text>
      <text x="0" y="174">  issued to Bus 02 driver</text>
    </g>
  </g>

  <!-- ARROW 3 -->
  <g transform="translate(818, 200)">
    <line x1="0" y1="0" x2="22" y2="0" stroke="#3B82F6" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="22,-5 32,0 22,5" fill="#3B82F6"/>
  </g>

  <!-- STEP 4 -->
  <g transform="translate(855, 85)" filter="url(#glowRescue)">
    <rect width="200" height="250" rx="12" fill="url(#cardBg)" stroke="#10B981" stroke-width="1.5"/>
    <rect width="200" height="42" rx="12" fill="#047857"/>
    <text x="100" y="26" fill="#FFFFFF" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle">4. AUTO HANDOVER</text>

    <g transform="translate(16, 60)" font-family="sans-serif" font-size="11" fill="#E2E8F0">
      <text x="0" y="16" font-weight="700" fill="#34D399">Dynamic Re-link:</text>
      <text x="0" y="34">• Stranded students</text>
      <text x="0" y="52">  automatically reassigned</text>
      <text x="0" y="70">  to Bus 02</text>
      <text x="0" y="88">• Live maps auto-sync</text>

      <text x="0" y="120" font-weight="700" fill="#34D399">Guardian Alert:</text>
      <text x="0" y="138">• Parents notified of</text>
      <text x="0" y="156">  rescue bus number</text>
      <text x="0" y="174">• Zero manual passenger</text>
      <text x="0" y="192">  re-registration</text>
    </g>
  </g>
</svg>
