<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>
    <filter id="mapShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1100" height="500" fill="#0B132B" rx="16" />

  <!-- Title Header -->
  <g transform="translate(50, 35)">
    <text x="0" y="0" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800">
      Student Live Tracking &amp; Smart Arrival Interface
    </text>
    <text x="0" y="22" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
      Adaptive Predictive ETA • Dynamic Seat Occupancy • Offline HMAC-SHA256 Boarding Pass
    </text>
  </g>

  <!-- Left: Simulated Map View -->
  <g transform="translate(50, 75)" filter="url(#mapShadow)">
    <rect width="580" height="390" rx="12" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1.5" />
    <!-- Roads -->
    <path d="M 0 180 Q 200 160 320 220 T 580 200" fill="none" stroke="#FFFFFF" stroke-width="24" />
    <path d="M 280 0 L 320 390" fill="none" stroke="#FFFFFF" stroke-width="20" />
    <path d="M 120 0 L 140 390" fill="none" stroke="#FFFFFF" stroke-width="14" />
    <path d="M 450 0 L 460 390" fill="none" stroke="#FFFFFF" stroke-width="16" />

    <!-- Route Line (Blue road-following polyline) -->
    <path d="M 60 180 Q 200 160 320 220 L 460 205 L 540 120" fill="none" stroke="#2563EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Bus Stop Markers -->
    <circle cx="150" cy="170" r="8" fill="#10B981" stroke="#FFFFFF" stroke-width="3"/>
    <text x="150" y="152" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">Main Bus Stand</text>

    <!-- Student Pickup Stop Marker (Target) -->
    <circle cx="320" cy="220" r="12" fill="#EF4444" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="320" cy="220" r="22" fill="none" stroke="#EF4444" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="320" y="258" fill="#B91C1C" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">📍 My Pickup: Railway Station</text>

    <!-- Moving Bus Marker -->
    <g transform="translate(210, 160)">
      <circle cx="20" cy="20" r="20" fill="#3B82F6" stroke="#FFFFFF" stroke-width="3"/>
      <polygon points="20,8 28,26 20,22 12,26" fill="#FFFFFF" transform="rotate(45 20 20)"/>
    </g>

    <!-- Floating Top Header -->
    <g transform="translate(20, 20)">
      <rect width="320" height="42" rx="10" fill="#FFFFFF" filter="url(#mapShadow)"/>
      <circle cx="24" cy="21" r="14" fill="#DBEAFE"/>
      <text x="24" y="26" fill="#1E40AF" font-family="sans-serif" font-size="14" text-anchor="middle">🎓</text>
      <text x="48" y="18" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="800">Aditya Varma</text>
      <text x="48" y="32" fill="#64748B" font-family="sans-serif" font-size="10">Assigned: Bus 01 • Route A</text>
      <rect x="235" y="11" width="72" height="20" rx="10" fill="#DCFCE7"/>
      <text x="271" y="25" fill="#15803D" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">ON ROUTE</text>
    </g>
  </g>

  <!-- Right: Simulated Floating Bottom Sheet Card -->
  <g transform="translate(660, 75)" filter="url(#mapShadow)">
    <rect width="390" height="390" rx="14" fill="url(#sheetGrad)" stroke="#CBD5E1" stroke-width="1.2" />

    <!-- Sheet Drag Handle -->
    <rect x="175" y="10" width="40" height="4" rx="2" fill="#94A3B8"/>

    <!-- Predictive ETA Header Block -->
    <g transform="translate(24, 30)">
      <text x="0" y="14" fill="#2563EB" font-family="sans-serif" font-size="10" font-weight="800" letter-spacing="1">PREDICTIVE ARRIVAL ESTIMATE</text>
      <text x="0" y="44" fill="#0F172A" font-family="sans-serif" font-size="28" font-weight="900">8 mins</text>
      <text x="110" y="40" fill="#64748B" font-family="sans-serif" font-size="12">To your stop: <tspan font-weight="700" fill="#0F172A">Railway Station</tspan></text>
      <rect x="230" y="18" width="110" height="28" rx="6" fill="#1E40AF"/>
      <text x="285" y="36" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">🪪 College Pass</text>
    </g>

    <!-- Divider -->
    <line x1="24" y1="92" x2="366" y2="92" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Seat Occupancy Bar -->
    <g transform="translate(24, 108)">
      <text x="0" y="12" fill="#64748B" font-family="sans-serif" font-size="10" font-weight="800">SEAT OCCUPANCY</text>
      <text x="250" y="12" fill="#0F172A" font-family="sans-serif" font-size="11" font-weight="800">34 / 50 (Moderate)</text>
      <rect x="0" y="20" width="342" height="10" rx="5" fill="#E2E8F0"/>
      <rect x="0" y="20" width="232" height="10" rx="5" fill="#10B981"/>
    </g>

    <!-- 4 Stats Grid -->
    <g transform="translate(24, 160)">
      <rect width="165" height="55" rx="8" fill="#F1F5F9"/>
      <text x="14" y="24" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="800">3.2 km</text>
      <text x="14" y="42" fill="#64748B" font-family="sans-serif" font-size="10">Road Distance</text>

      <rect x="177" y="0" width="165" height="55" rx="8" fill="#F1F5F9"/>
      <text x="191" y="24" fill="#0F172A" font-family="sans-serif" font-size="16" font-weight="800">32 km/h</text>
      <text x="191" y="42" fill="#64748B" font-family="sans-serif" font-size="10">Live Bus Speed</text>

      <rect x="0" y="65" width="165" height="55" rx="8" fill="#F1F5F9"/>
      <text x="14" y="89" fill="#0F172A" font-family="sans-serif" font-size="14" font-weight="800">Market Junc</text>
      <text x="14" y="107" fill="#64748B" font-family="sans-serif" font-size="10">Approaching Stop</text>

      <rect x="177" y="65" width="165" height="55" rx="8" fill="#F1F5F9"/>
      <text x="191" y="89" fill="#10B981" font-family="sans-serif" font-size="14" font-weight="800">Active (4.2m)</text>
      <text x="191" y="107" fill="#64748B" font-family="sans-serif" font-size="10">GPS Quality</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(24, 310)">
      <rect width="105" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="52" y="22" fill="#1E293B" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">🔀 Alt Buses</text>

      <rect x="115" y="0" width="115" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="172" y="22" fill="#1E293B" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">🔗 Share Trip</text>

      <rect x="240" y="0" width="102" height="36" rx="8" fill="#FFFFFF" stroke="#CBD5E1"/>
      <text x="291" y="22" fill="#1E293B" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">📋 Stop List</text>
    </g>
  </g>
</svg>
